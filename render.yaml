services:
  - type: web
    name: hotel-102-preview
    env: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 wsgi:application
    envVars:
      - key: HOTEL102_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: BOOKING_URL
        value: /booking/
      - key: MAIN_URL
        value: /
      - key: BOOKING_PUBLIC_URL
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FLASK_DEBUG
        value: "0"
      - key: IYZICO_MODE
        value: sandbox
      - key: IYZICO_API_KEY
        sync: false
      - key: IYZICO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-102-preview-db
          property: connectionString

databases:
  - name: hotel-102-preview-db
    plan: starter
