{% extends 'admin/layout.html' %}

{% block header %}Site Settings{% endblock %}

{% block content %}
<div class="max-w-3xl">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
        <h3 class="text-lg font-semibold text-gray-800 border-b pb-4 mb-6">Homepage Hero Section</h3>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Background Media Type</label>
                <select name="hero_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-cyan-500 focus:border-cyan-500">
                    <option value="image" {% if settings.hero_type == 'image' %}selected{% endif %}>Static Image</option>
                    <option value="video" {% if settings.hero_type == 'video' %}selected{% endif %}>Video (MP4)</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-4">Current Media</label>
                <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-gray-100 border border-gray-200">
                    {% if settings.hero_type == 'video' %}
                        <video class="w-full h-full object-cover" autoplay loop muted>
                            <source src="{% if not settings.hero_media.startswith('http') %}{{ url_for('uploaded_file', filename=settings.hero_media) }}{% else %}{{ settings.hero_media }}{% endif %}" type="video/mp4">
                        </video>
                    {% else %}
                        <img class="w-full h-full object-cover" src="{% if not settings.hero_media.startswith('http') %}{{ url_for('uploaded_file', filename=settings.hero_media) }}{% else %}{{ settings.hero_media }}{% endif %}">
                    {% endif %}
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Upload New Media (Image or MP4)</label>
                <input type="file" name="hero_media" accept="image/*,video/mp4" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-cyan-50 file:text-cyan-700 hover:file:bg-cyan-100 transition-colors">
                <p class="text-xs text-gray-400 mt-2">Max limit: 50MB. Choosing a new file replaces the active hero media immediately.</p>
            </div>

            <div class="pt-4 border-t border-gray-100 flex justify-end">
                <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white font-medium py-2 px-8 rounded-lg transition-colors shadow-sm">
                    Update Settings
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
