<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ethereal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen text-gray-800 font-sans">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-serif text-cyan-900 font-semibold tracking-wide">Ethereal Store</h1>
            <p class="text-gray-500 mt-2 text-sm uppercase tracking-widest">Admin Authorization</p>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-50 text-red-600 p-3 rounded-lg mb-6 text-sm text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-cyan-500 focus:border-cyan-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-cyan-500 focus:border-cyan-500" required>
            </div>
            <button type="submit" class="w-full bg-cyan-800 text-white font-medium py-3 rounded-lg hover:bg-cyan-900 transition-colors shadow-md">
                Sign In to Dashboard
            </button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-400">
            <a href="{{ url_for('index') }}" class="hover:text-gray-600">&larr; Back to Website</a>
        </div>
    </div>
</body>
</html>
