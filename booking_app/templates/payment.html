<div id="step-4" class="step-content">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
        <div class="col-span-2">
            <h3 class="font-headline text-2xl mb-8 border-b pb-4">Payment Details</h3>
            <div class="space-y-8">
                <div>
                    <label
                        class="font-label tracking-widest text-xs uppercase text-on-surface-variant block mb-2">Name
                        on Card</label>
                    <input type="text" id="ccName" class="input-field" placeholder="JOHN DOE">
                </div>
                <div>
                    <label
                        class="font-label tracking-widest text-xs uppercase text-on-surface-variant block mb-2">Card
                        Number</label>
                    <input type="text" id="ccNumber" class="input-field" placeholder="0000 0000 0000 0000">
                </div>
                <div class="grid grid-cols-2 gap-8">
                    <div>
                        <label
                            class="font-label tracking-widest text-xs uppercase text-on-surface-variant block mb-2">Expiry
                            Date</label>
                        <input type="text" id="ccExpiry" class="input-field" placeholder="MM/YY">
                    </div>
                    <div>
                        <label
                            class="font-label tracking-widest text-xs uppercase text-on-surface-variant block mb-2">CVC</label>
                        <input type="password" id="ccCvc" class="input-field" placeholder="123"
                            maxlength="4">
                    </div>
                </div>
            </div>
            <div class="flex justify-between mt-12 bg-primary/5 p-4 rounded-xl">
                <button type="button" onclick="prevStep(3)"
                    class="text-primary tracking-widest text-sm hover:underline p-2">← Back</button>
                <button type="button" onclick="submitReservation()" id="btn-submit"
                    class="bg-primary text-white px-8 py-3 rounded-full font-label tracking-widest text-sm hover:bg-primary-container transition-colors shadow-lg">Confirm
                    Reservation</button>
            </div>
        </div>

        <!-- Booking Summary Cart -->
        <div
            class="col-span-1 bg-surface-container-low p-6 rounded-xl border border-outline-variant/20 h-fit">
            <h4 class="font-headline text-lg mb-6 text-primary">Summary</h4>
            <div class="space-y-4 mb-6 border-b border-outline-variant/30 pb-6">
                <div>
                    <span
                        class="text-xs uppercase tracking-widest text-on-surface-variant mb-1 block">Dates</span>
                    <div class="font-semibold text-sm" id="sum-dates">-</div>
                </div>
                <div>
                    <span
                        class="text-xs uppercase tracking-widest text-on-surface-variant mb-1 block">Guests</span>
                    <div class="font-semibold text-sm" id="sum-guests">-</div>
                </div>
                <div>
                    <span
                        class="text-xs uppercase tracking-widest text-on-surface-variant mb-1 block">Room</span>
                    <div class="font-semibold text-sm" id="sum-room">-</div>
                </div>
            </div>
            <div class="flex justify-between items-end">
                <span class="text-sm">Total</span>
                <span class="text-2xl font-headline text-primary" id="sum-total">$0</span>
            </div>
        </div>
    </div>
</div>
