<div id="step-2" class="step-content">
    <h3 class="font-headline text-2xl mb-8 border-b pb-4">Select Your Sanctuary</h3>
    <div class="space-y-6 max-h-[60vh] overflow-y-auto pr-2 no-scrollbar" id="roomList">
        {% for room in rooms %}
        <div class="room-card border border-outline-variant/30 rounded-xl p-4 flex flex-col sm:flex-row gap-6 cursor-pointer transition-all hover:bg-surface-container-low"
            onclick="selectRoom({{ room.id }}, '{{ room.name }}', {{ room.price }})">
            <div class="w-full sm:w-1/3 aspect-[4/3] rounded-lg overflow-hidden shrink-0">
                <img src="{% if not room.hero_img.startswith('http') %}{{ url_for('uploaded_file', filename=room.hero_img) }}{% else %}{{ room.hero_img }}{% endif %}"
                    class="w-full h-full object-cover">
            </div>
            <div class="flex flex-col justify-between py-2 w-full">
                <div>
                    <h4 class="font-headline text-xl mb-2">{{ room.name }}</h4>
                    <span class="font-label tracking-wide text-primary block mb-3 font-semibold">${{
                        room.price }} / night</span>
                    <div class="flex gap-4 mb-4">
                        <div class="flex items-center gap-1"><span
                                class="material-symbols-outlined text-sm text-secondary">square_foot</span><span
                                class="text-xs text-on-surface-variant">{{ room.sqm }} sqm</span></div>
                        <div class="flex items-center gap-1"><span
                                class="material-symbols-outlined text-sm text-secondary">king_bed</span><span
                                class="text-xs text-on-surface-variant">{{ room.bed }}</span></div>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-auto">
                    <a href="{{ MAIN_URL }}{{ room.slug }}.html" target="_blank"
                        class="text-xs text-secondary hover:underline"
                        onclick="event.stopPropagation()">View Details</a>
                    <button type="button"
                        class="border border-primary text-primary px-4 py-1.5 rounded-full text-xs font-semibold pointer-events-none room-select-btn"
                        id="btn-room-{{ room.id }}">Select</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="flex justify-between mt-8">
        <button type="button" onclick="prevStep(1)"
            class="text-primary tracking-widest text-sm hover:underline">← Back</button>
        <button type="button" onclick="nextStep(3)"
            class="bg-primary text-white px-8 py-3 rounded-full font-label tracking-widest text-sm hover:bg-primary-container transition-colors disabled:opacity-50"
            id="btn-next-2" disabled>Continue to Details →</button>
    </div>
</div>
